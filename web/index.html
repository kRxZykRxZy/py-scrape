<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>py-scrape</title><link rel=stylesheet href=/static/style.css><link rel=stylesheet href=/static/p5.css></head><body><main><header><div><h1>py-scrape</h1><p>London business lead finder</p></div><div id=stats>Loading…</div></header><section class=panel><h2>New scrape</h2><div class=form><label>Postcode district<input id=postcode placeholder="UB10" maxlength=5></label><label>Leads<input id=amount type=number min=1 max=1000 value=25></label><button id=run>Start scrape</button></div><div id=progress></div></section><section class=panel><div class=toolbar><h2>Lead management</h2><input id=filter placeholder="Search name, phone, email…"><select onchange="loadLeads()" id=statusFilter><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>won</option><option>lost</option></select><select onchange="bulkStatus(this.value)"><option value="">Bulk status…</option><option>new</option><option>contacted</option><option>qualified</option><option>won</option><option>lost</option></select><button id=bulkDelete>Delete selected</button><a href=/api/export.csv>Export CSV</a></div><div class=tablewrap><table><thead><tr><th></th><th>Business</th><th>Category</th><th>Phone</th><th>Email</th><th>Address</th><th>Status</th><th></th></tr></thead><tbody id=leads></tbody></table></div></section><section class=panel><h2>Create lead</h2><form id=create><div class=form><input name=name placeholder=Business required><input name=phone placeholder=Phone><input name=email placeholder=Email><input name=address placeholder=Address><input name=category placeholder=Category><button type=button id=createBtn>Create</button></div></form></section><section class=panel><h2>Live logs</h2><pre id=logs></pre></section></main><script src=/static/app.js></script><script src=/static/phase5.js></script></body></html>
