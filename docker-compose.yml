services:
  py-scrape:
    build: .
    restart: unless-stopped
    cpus: "1.0"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/py_scrape.db
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./data:/app/data
    depends_on:
      - scraper-worker

  scraper-worker:
    build: .
    restart: unless-stopped
    cpus: "3.0"
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/py_scrape.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
